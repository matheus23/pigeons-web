name: pages

# Builds the wasm page and publishes dist/ to GitHub Pages.
#
# The page is entirely static and self-contained: no server, no secrets, and no
# backend. Set Settings -> Pages -> Source to "GitHub Actions" once.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by commit SHA: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rust-toolchain.toml pins the channel and the wasm target.
      - name: install rust
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown
          rustc --version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Must match the wasm-bindgen version pinned in crates/web/Cargo.toml.
      - name: install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked

      # Optional, but it halves the download: build.sh uses wasm-opt when present.
      # Pinned because Ubuntu's binaryen (116) miscompiles this module: it retargets
      # the __wbindgen_externrefs export to the funcref table and the page dies at
      # startup with "failed to grow table". dev/check-wasm.mjs guards the build.
      - name: install binaryen
        run: |
          version=126
          sha256=e487e0eac1f02a6739816c617270b033e5d3f8ca90439301fd0286460322fd76
          curl -sSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${version}/binaryen-version_${version}-x86_64-linux.tar.gz"
          echo "$sha256  /tmp/binaryen.tar.gz" | sha256sum -c -
          tar -xzf /tmp/binaryen.tar.gz -C "$HOME"
          echo "$HOME/binaryen-version_${version}/bin" >> "$GITHUB_PATH"
          "$HOME/binaryen-version_${version}/bin/wasm-opt" --version

      - name: build
        run: ./build.sh release

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
