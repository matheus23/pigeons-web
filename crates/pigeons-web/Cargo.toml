[package]
name = "pigeons-web"
description = "ssh in your browser, over pigeons"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
iroh = "1.3"
async-trait = "0.1"
base64 = "0.22"
console_error_panic_hook = "0.1"
futures = "0.3"
# Randomness for wasm: only the dependency graph needs this, not this crate.
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
kereru = { path = "../kereru" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "sync"] }
avt = "0.18"
# Pinned to the wasm-bindgen CLI on this machine; 0.2.x requires an exact match.
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "Clipboard",
  "Crypto",
  "CryptoKey",
  "CssStyleDeclaration",
  "ClipboardEvent",
  "DataTransfer",
  "Document",
  "DomRect",
  "Element",
  "Event",
  "EventTarget",
  "HtmlButtonElement",
  "HtmlDivElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlSpanElement",
  "HtmlTextAreaElement",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbVersionChangeEvent",
  "IdbDatabase",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbRequestReadyState",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbVersionChangeEvent",
  "KeyboardEvent",
  "Location",
  "MouseEvent",
  "Navigator",
  "console",
  "Node",
  "PointerEvent",
  "ResizeObserver",
  "ResizeObserverBoxOptions",
  "ResizeObserverEntry",
  "ResizeObserverSize",
  "Storage",
  "SubtleCrypto",
  "Text",
  "VisualViewport",
  "Window",
]
